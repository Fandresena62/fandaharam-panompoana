<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fandaharam-panompoana</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fandaharana">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f9;--card:#fff;--ink:#1c2433;--mut:#5b6678;--head:#1f3a5f;--line:#d9dfe9;--line2:#c3ccdb;--note:#eaf4f6;--sortie:#fde7e7;--warn:#8a5200;--warnbg:#fff1d6;--dng:#b3261e;--ds:55%;--dl:89%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151e;--card:#182030;--ink:#e8edf6;--mut:#9aa7bb;--head:#2b4a78;--line:#2c3850;--line2:#3b4a68;--note:#14303a;--sortie:#5a2428;--warn:#ffcf70;--warnbg:#3a2d10;--dng:#ff8a80;--ds:35%;--dl:26%}}
:root[data-theme="dark"]{--bg:#10151e;--card:#182030;--ink:#e8edf6;--mut:#9aa7bb;--head:#2b4a78;--line:#2c3850;--line2:#3b4a68;--note:#14303a;--sortie:#5a2428;--warn:#ffcf70;--warnbg:#3a2d10;--dng:#ff8a80;--ds:35%;--dl:26%}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:860px;margin:0 auto 10px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;min-height:36px;border-radius:999px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #4d8fe0;outline-offset:1px}
button[aria-pressed="true"],button.pri{background:var(--head);color:#fff;border-color:var(--head)}
button.dng{color:var(--dng);border-color:var(--dng)}
.sp{flex:1}
#lbl{font-weight:700;min-width:120px;text-align:center}
body[data-v="dash"] #stage,body[data-v="dash"] #mbar,body[data-v="dash"] .hint{display:none}
body[data-v="prog"] #dash{display:none}

/* ---------- Fandraisana ---------- */
#dash{max-width:640px;margin:0 auto;font-size:16px}
header{background:var(--head);color:#fff;text-align:center;padding:14px;border-radius:14px;margin-bottom:10px}
h1{margin:0;font-size:20px;letter-spacing:.5px}
header p{margin:2px 0 0;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:17px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.card .hd h2{margin:0}
.big{font-size:27px;font-weight:700;line-height:1.2}
.cd{display:inline-block;margin:8px 0 4px;padding:3px 12px;border-radius:999px;background:var(--note);font-weight:600;font-size:14px}
.svc{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.svc .tm{font-size:20px;font-weight:700}
.rl{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.rl span{color:var(--mut)}
.rl b{text-align:right}
.warn{color:var(--warn);background:var(--warnbg);padding:1px 9px;border-radius:6px;font-weight:600;font-size:14px}
.bd{display:inline-block;margin-left:8px;padding:1px 9px;border-radius:6px;background:var(--sortie);font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--note);border-radius:999px;padding:3px 11px;font-size:14px}
.item{border-top:1px solid var(--line);padding:10px 0}
.item .ih{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item .ih b{font-size:16px}
.item .sm{color:var(--mut);font-size:14px}
.item button{padding:3px 11px;min-height:32px}
.mut{color:var(--mut)}
.form{background:var(--note);border-radius:12px;padding:12px;margin:8px 0}
.form h3{margin:0 0 4px;font-size:16px}
.form label{display:block;margin:10px 0 0;font-size:14px;color:var(--mut)}
.form input[type="text"],.form input[type="tel"],.form select{display:block;width:100%;margin-top:3px;padding:10px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px}
.form .ck{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.form .ck label{display:flex;align-items:center;gap:6px;margin:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--ink);font-size:15px}
.form .ck input{margin:0;width:18px;height:18px}
.form label.ckl{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}
.form .ckl input{width:20px;height:20px;margin:0}
.form .fa{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90%;background:#1c2433;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;box-shadow:0 4px 16px #0005}

/* ---------- Programme (endrika vaovao) ---------- */
.stage{max-width:860px;margin:0 auto;overflow-x:auto;position:relative}
#sheet{width:760px;max-width:100%;margin:0 auto;transform-origin:0 0}
.stage.rot #sheet{position:absolute;left:0;top:0;max-width:none;margin:0}
button:disabled{opacity:.4;cursor:default}
.sh{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #0001}
.sh header{background:var(--card);color:var(--ink);border-radius:0;margin:0;padding:18px 16px 14px;border-bottom:4px solid var(--head)}
.sh h1{font-size:21px;letter-spacing:2.5px;color:var(--ink)}
.sh header p{margin:3px 0 0;opacity:1;color:var(--mut);font-size:14px}
.sh header p.mo{margin-top:8px;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.5px}
.sh header p.mo .e{padding:3px 16px;border-radius:999px;background:var(--note);border:1px solid var(--line)}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);font-size:13.5px;font-variant-numeric:tabular-nums}
th{background:var(--head);color:#fff;padding:10px 6px;font-size:11px;letter-spacing:.7px;text-transform:uppercase;position:relative}
td{padding:9px 8px;border-bottom:1px solid var(--line2);text-align:center;vertical-align:middle}
tr.gi td{border-bottom:1px dashed var(--line)}
tr.zb td{background-image:linear-gradient(#80808014,#80808014)}
td.d{background-color:hsl(var(--h) var(--ds) var(--dl));font-weight:700}
td.gm{border-right:1px solid var(--line)}
tr.s td{background-color:var(--sortie)}
tr.s td.d{background-color:hsl(var(--h) var(--ds) var(--dl))}
tr.s td:first-child{box-shadow:inset 5px 0 0 var(--dng)}
.sb{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:5px;background:var(--dng);color:#fff;font-size:10px;font-weight:700;letter-spacing:.8px}
td.cont .e{color:var(--mut);font-weight:400}
.e{display:inline-block;min-width:40px;max-width:100%;white-space:pre-wrap;outline:none;padding:2px 5px;border-radius:6px}
.e:hover{background:#80808020}
.e:empty::before{content:"—";color:var(--mut)}
.e:focus{background:var(--note);color:var(--ink);box-shadow:0 0 0 2px #4d8fe0}
.tsw{position:relative;display:inline-block;min-width:78px}
.tsw::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:11px;pointer-events:none}
.tn{display:block;min-width:78px;padding:4px 24px 4px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600}
.tn:empty::before{content:"Fidio";color:var(--mut);font-weight:400}
td.dup .tn{background:var(--warnbg);border-color:#e0a800;color:var(--warn)}
.ms{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.act{white-space:nowrap;width:1%}
.act button{width:28px;height:28px;min-height:0;padding:0;border-radius:8px;font-size:13px;line-height:1;margin-left:3px}
.act button.dl{color:var(--dng);border-color:var(--dng);margin-left:10px}
.act button[aria-pressed="true"]{background:var(--dng);border-color:var(--dng);color:#fff}
th button{position:absolute;top:2px;right:2px;width:18px;height:18px;min-height:0;padding:0;border-radius:5px;font-size:10px;line-height:1;background:transparent;color:#fff;border-color:#fff4;opacity:.7}
.note{padding:12px 16px;background:var(--note);border-top:1px solid var(--line);color:var(--mut);font-size:12.5px}
.pf{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.printonly{display:none}
.toast .tu{margin-left:12px;background:#fff;color:#1c2433;border:0;min-height:28px;padding:2px 12px;font-weight:700}
@media (max-width:600px){body{padding:8px}table{font-size:12.5px}td{padding:7px 3px}.e{min-width:34px}.sh h1{font-size:18px}}
.hint{max-width:860px;margin:8px auto 0;color:var(--mut);font-size:12px;text-align:center}
#io{max-width:860px;margin:10px auto;display:none}
#io textarea{width:100%;height:120px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px monospace}

/* ---------- Fanontana (endrika madio) ---------- */
@media print{
@page{margin:9mm}
:root,:root[data-theme="dark"],:root:not([data-theme="light"]){padding:0;--bg:#fff;--card:#fff;--ink:#14213a;--mut:#4a5670;--head:#1f3a5f;--line:#d5dbe6;--line2:#aab4c6;--note:#f4f6fa;--sortie:#fdecec;--warnbg:#fff;--warn:#000;--dng:#b3261e;--gold:#e8a33d;--ds:55%;--dl:90%}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#fff;padding:0;font-size:16px;line-height:1.3}
.bar,#mbar,#io,.hint,.tools,.act,th button,#dash,.toast,.ms,.tsw::after{display:none!important}
body[data-v="dash"] #stage,body[data-v="prog"] #stage{display:block}
.stage{max-width:none;overflow:visible;height:auto!important;width:auto!important;position:static}
#sheet,.stage.rot #sheet{width:100%!important;max-width:none!important;transform:none!important;position:static!important;margin:0}
.sh{border:2px solid var(--head);border-radius:0;box-shadow:none;overflow:visible}
.sh header{background:var(--head);color:#fff;padding:14px 16px 12px;border-bottom:5px solid var(--gold);position:relative}
.sh h1{font-size:30px;letter-spacing:5px;color:#fff;font-weight:800}
.sh header p{font-size:16px;color:#d8e2f4;margin-top:4px;letter-spacing:1px}
.sh header p.mo{margin-top:9px;font-size:20px;color:#14213a;letter-spacing:1.5px;text-transform:uppercase}
.sh header p.mo .e{background:var(--gold)!important;border:0!important;border-radius:999px;padding:3px 26px!important;color:#14213a;font-weight:800;font-size:20px;display:inline-block}
table{font-size:16px;border-collapse:collapse}
th{font-size:13.5px;letter-spacing:1.4px;padding:9px 5px;background:var(--head);color:#fff;border-right:1px solid #ffffff40}
td{padding:6px 6px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line)}
td:last-child,th:last-child{border-right:0}
tr.gi td{border-bottom:1px dashed var(--line2)}
tr.zb td{background-image:linear-gradient(#1f3a5f0d,#1f3a5f0d)}
td.d{font-weight:800;font-size:16.5px}
td:first-child{font-weight:700}
tr.s td{background-color:var(--sortie)}
tr.s td:first-child{box-shadow:inset 6px 0 0 var(--dng)}
.sb{display:block;width:max-content;margin:3px auto 0;font-size:10.5px;padding:1px 9px;letter-spacing:1.2px}
tr.s td:first-child{padding-left:12px}
thead{display:table-header-group}
tr{break-inside:avoid}
.e,.tn{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;min-width:0!important;font-size:16px;font-weight:600}
.e:empty::before,.tn:empty::before{content:""}
td.dup .tn{color:#000}
tbody tr:last-child td{border-bottom:0}
.note{break-inside:avoid;color:var(--ink);font-size:14.5px;background:var(--note);border-top:2px solid var(--head);border-left:6px solid var(--gold);padding:9px 14px}
.pf{display:block;padding:6px 14px;text-align:center;font-size:12px;letter-spacing:.6px;color:#5a667f;border-top:1px solid var(--line2)}
}
</style>
</head>
<body data-v="dash">
<div class="bar">
  <button id="vd" data-v="dash" aria-pressed="true">⌂ Fandraisana</button>
  <button id="vp" data-v="prog" aria-pressed="false">📋 Programme</button>
  <span class="sp"></span>
  <button id="ori" title="Fitodika ny taratasy: Auto / Mitsivalana / Mitsangana">↔ Auto</button>
  <button id="prt" title="Hanonta na hitahiry ho PDF">🖨 Hanonta</button>
  <button id="thm" aria-pressed="false" aria-label="Maizina / mazava">☾</button>
  <button id="iob" aria-pressed="false">⇅ Tahiry</button>
</div>
<div class="bar" id="mbar">
  <button id="prev" aria-label="Volana teo aloha">‹</button>
  <span id="lbl"></span>
  <button id="next" aria-label="Volana manaraka">›</button>
  <button id="today">Androany</button>
  <button id="undo" disabled title="Averina ny fanafoanana">↶ Hanafoana</button>
  <span class="sp"></span>
  <button id="rot" aria-pressed="false">⟳ Hodina</button>
</div>
<div id="io">
  <textarea id="ta" placeholder="Eto no miseho ny angona rehetra. Adikao hotehirizina, na apetaho eto ny angona taloha dia tsindrio ‘Ampiasao’."></textarea>
  <div class="tools"><button id="exp">Haka ny angona</button><button id="imp">Ampiasao</button></div>
</div>
<div id="dash"></div>
<div class="stage" id="stage"><div id="sheet"></div></div>
<p class="hint">Tsindrio na inona na inona hanovana azy. Tsindrio ny anaran’ny mpitarika hisafidianana. Voatahiry ho azy ao amin’ity fitaovana ity.</p>
<script>
var MG=["Janoary","Febroary","Martsa","Aprily","Mey","Jona","Jolay","Aogositra","Septambra","Oktobra","Novambra","Desambra"];
var DN=["Alahady ariva","Alatsinainy","Talata","Alarobia","Alakamisy","Zoma","Asabotsy"];
var HUE={alahady:275,alatsinainy:340,talata:215,alarobia:100,alakamisy:165,zoma:55,asabotsy:35};
var COLS=["Daty","Andro","Ora","Toerana fihaonana","Faritany","Mpitarika"];
var TITLE="FANDAHARAM-PANOMPOANA",CONG="Fiangonana Ambohitrarivo";
var NOTE="Fanamarihana: Isaky ny Asabotsy voalohan’ny volana dia misy sortie amin’ny faritany lavitra, ary mitambatra ny andiam-pitory rehetra. Tonga alohan’ny ora fanombohana, ary raha misy fiovana dia ampahafantaro mialoha ny mpitarika.";
var S={m:{}},view="dash",rotated=false,fm=null,restoreV=null,now=new Date(),Y=now.getFullYear(),M=now.getMonth();

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function escA(s){return esc(s).replace(/"/g,"&quot;")}
function wo(w){return (w+6)%7}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36)}

/* ---------- angona fototra: rahalahy sy faritany ---------- */
function defCfg(){
  var nm=["Nanja","Jean Luc","Miray","Toky","Herizoa","Solo","Absaloma","Nandraina","Josia","Ranja","Elie"];
  var b=nm.map(function(n,i){return {id:"b"+(i+1),n:n,p:""}});
  function id(n){return b.filter(function(x){return x.n==n})[0].id}
  var Z=[
    {id:"z1",n:"Faritanin’ny Mpisava lalana",w:2,g:"",h:"8:30",l:"Efitrano Ambohitrarivo",b:["Nanja","Jean Luc"]},
    {id:"z2",n:"Amboanongo",w:4,g:"",h:"9:00",l:"Efitrano Amboanongo",b:["Miray","Toky","Nanja","Herizoa","Solo"]},
    {id:"z3",n:"Ambohivory kely",w:6,g:"Andiam-pitory 1",h:"8:30",l:"Ao amin’ny rahalahy Rija",b:["Jean Luc","Absaloma","Nandraina"]},
    {id:"z4",n:"Ambohitrarivo",w:6,g:"Andiam-pitory 2",h:"8:30",l:"Efitrano Ambohitrarivo",b:["Josia","Ranja"]},
    {id:"z5",n:"Fampianarana",w:0,g:"",h:"11:00",l:"Efitrano Ambohitrarivo",b:["Josia","Ranja","Elie","Nandraina","Jean Luc","Absaloma"]}
  ];
  Z.forEach(function(z){z.b=z.b.map(id)});
  return {v:1,bro:b,fz:Z};
}
function ensure(){if(!S.cfg||!Array.isArray(S.cfg.bro)||!Array.isArray(S.cfg.fz))S.cfg=defCfg()}
try{var raw=localStorage.getItem("fp2");if(raw)S=JSON.parse(raw);if(!S||!S.m)S={m:{}}}catch(e){S={m:{}}}
ensure();
function save(){try{localStorage.setItem("fp2",JSON.stringify(S))}catch(e){}}
function bro(id){return S.cfg.bro.filter(function(x){return x.id==id})[0]}
function bname(id){var b=bro(id);return b?b.n:""}
function fzOf(id){return S.cfg.fz.filter(function(x){return x.id==id})[0]}
function fzSorted(){return S.cfg.fz.slice().sort(function(a,b){return wo(a.w)-wo(b.w)})}

function saveBro(id,n,p){
  n=String(n||"").trim();p=String(p||"").trim();
  if(!n)return "Soraty ny anaran’ny rahalahy.";
  var dupl=S.cfg.bro.some(function(x){return x.id!=id&&x.n.trim().toLowerCase()==n.toLowerCase()});
  if(dupl)return "Efa ao amin’ny lisitra io anarana io.";
  var b=id&&bro(id);
  if(b){b.n=n;b.p=p}else S.cfg.bro.push({id:uid("b"),n:n,p:p});
  save();return "";
}
function delBro(id){
  S.cfg.bro=S.cfg.bro.filter(function(x){return x.id!=id});
  S.cfg.fz.forEach(function(z){z.b=z.b.filter(function(x){return x!=id})});
  save();
}
function saveFz(o){
  o.n=String(o.n||"").trim();o.l=String(o.l||"").trim();o.h=String(o.h||"").trim();o.g=String(o.g||"").trim();
  if(!o.n)return "Soraty ny anaran’ny faritany.";
  o.w=+o.w;o.f=o.f?1:0;if(!(o.w>=0&&o.w<=6))return "Fidio ny andro.";
  var z=o.id&&fzOf(o.id);
  if(z){z.n=o.n;z.w=o.w;z.g=o.g;z.h=o.h;z.l=o.l;z.b=o.b;z.f=o.f}
  else S.cfg.fz.push({id:uid("z"),n:o.n,w:o.w,g:o.g,h:o.h,l:o.l,b:o.b,f:o.f});
  save();return "";
}
function delFz(id){S.cfg.fz=S.cfg.fz.filter(function(x){return x.id!=id});save()}

/* ---------- volana ---------- */
function key(y,m){return y+"-"+(m+1)}
function ci(d,name){var n=name.toLowerCase();return d.cols.findIndex(function(c){return String(c).trim().toLowerCase()==n})}
function cell(d,r,name){var i=ci(d,name);return i>=0?String(r.c[i]||""):""}
function gen(y,m){
  var f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),rows=[],sat=0,a=MG[m].slice(0,3);
  for(var d=1;d<=n;d++){
    var w=(f+d-1)%7,zs=S.cfg.fz.filter(function(z){return z.w==w&&!z.f});if(!zs.length)continue;
    if(w==6)sat++;
    var so=(w==6&&sat==1)?1:0;
    zs.forEach(function(z){rows.push({c:[d+" "+a,DN[w],z.h,z.l,so?"Faritany lavitra":(z.g?z.g+": ":"")+z.n,""],z:z.id,s:so})});
  }
  return {t:TITLE,ch:CONG,lb:MG[m]+" "+y,note:NOTE,cols:COLS.slice(),rows:rows};
}
function monthData(y,m){return S.m[key(y,m)]||gen(y,m)}
function D(){var k=key(Y,M);if(!S.m[k])S.m[k]=gen(Y,M);return S.m[k]}
function hue(txt){var w=String(txt).trim().toLowerCase().split(/\s+/)[0];return HUE[w]}
function ed(attr,txt){return '<span class="e" contenteditable="true" '+attr+'>'+esc(txt)+'</span>'}

function leaderCell(r,ri,v){
  var z=r.z?fzOf(r.z):null,names=[];
  (z&&z.b.length?z.b.map(bname):S.cfg.bro.map(function(b){return b.n})).forEach(function(n){if(n&&names.indexOf(n)<0)names.push(n)});
  var cur=String(v||"").trim(),o='<option value="">(Foana)</option>';
  if(cur&&names.indexOf(cur)<0)names.unshift(cur);
  o+=names.map(function(n){return '<option value="'+escA(n)+'"'+(n==cur?' selected':'')+'>'+esc(n)+'</option>'}).join("");
  o+='<option value="__other__">✎ Hafa…</option>';

function autoAssign(){
  var d=D(),lc=ci(d,"mpitarika");if(lc<0)return 0;
  var cnt={},byDate={},days={},last={},n=0;
  function dn(r){var x=parseInt(r.c[0],10);return isNaN(x)?0:x}
  d.rows.forEach(function(r){var v=String(r.c[lc]||"").trim().toLowerCase();if(!v)return;cnt[v]=(cnt[v]||0)+1;(byDate[r.c[0]]=byDate[r.c[0]]||{})[v]=1;(days[v]=days[v]||[]).push(dn(r))});
  d.rows.forEach(function(r){
    var cur=String(r.c[lc]||"").trim().toLowerCase();
    if(cur){if(r.z)last[r.z]=cur;return}
    var z=r.z&&fzOf(r.z);if(!z)return;
    var best=null,bs=1e9,day=dn(r);
    z.b.map(bname).filter(Boolean).forEach(function(nm){
      var k=nm.toLowerCase();if((byDate[r.c[0]]||{})[k])return;
      var md=99;(days[k]||[]).forEach(function(x){md=Math.min(md,Math.abs(x-day))});
      /* mizara ho mitovy ny isa; manafay ny mpitarika efa nitarika tato ho ato (ao anatin'ny 14 andro, aloha na aoriana) */
      var sc=(cnt[k]||0)*10+(md<=14?(15-md)*1.5:0)+(last[r.z]==k?4:0);
      if(sc<bs){bs=sc;best=nm}});
    if(!best)return;
    var k2=best.toLowerCase();r.c[lc]=best;cnt[k2]=(cnt[k2]||0)+1;(byDate[r.c[0]]=byDate[r.c[0]]||{})[k2]=1;(days[k2]=days[k2]||[]).push(day);last[r.z]=k2;n++;
  });
  if(n)save();
  return n;
}
